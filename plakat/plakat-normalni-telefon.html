/* Plakát A3 na výšku (297 × 420 mm). Tisk: měřítko 100 %, bez okrajů. */
@page { size: 297mm 420mm; margin: 0; }

.row { margin-bottom: 5mm; display: grid; grid-template-columns: 1fr 46mm; gap: 0 10mm; align-items: start; }
.phone { margin-top: -11mm; padding: 1.8mm; border-radius: 7mm; background: #1a1a1a; box-shadow: 0 1mm 5mm rgba(0, 0, 0, .25); position: relative; }

.foot { margin: 6mm -18mm 0; margin-top: auto; background: #1a1a1a; color: #fff; padding: 11mm 18mm 13mm; display: grid; grid-template-columns: 1fr 1fr auto; gap: 0 10mm; align-items: center; }

.price { font-size: 46pt; font-weight: 800; line-height: 1; }
